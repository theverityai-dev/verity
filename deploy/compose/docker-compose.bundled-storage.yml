# Bundled object-store overlay: SeaweedFS's S3 gateway as the self-contained convenience store.
#
# Authority: taskplans/42_deployment_hardening.md §4.4 (an S3 backend that works with no cloud
# account); object-storage audit 2026-10-01, finding F2 (the previous bundled store could no
# longer be pulled and is archived upstream).
#
# Compose it with the base file (install.sh does, when VERITY_WITH_BUNDLED_STORAGE=1):
#   docker compose -f docker-compose.yml -f docker-compose.bundled-storage.yml up -d
#
# THIS IS THE S3 CONTRACT, NOT A SEAWEEDFS DEPENDENCY. The same four variables point at AWS,
# Ceph RGW, Wasabi, Backblaze B2 or any other S3-compatible server with no code change, and an
# external S3-compatible store remains the supported choice for enterprise deployments. This
# store exists so that a `docker compose up` produces a *working* storage backend with no cloud
# account. See deploy/docs/object-storage.md for the contract and for what was verified.
#
# IMAGE (every field of how this reference was chosen is recorded in object-storage.md):
#   chrislusf/seaweedfs:4.48 -> sha256:4e61d15f... (multi-arch index), Apache-2.0, published
#   2026-09-28 from https://github.com/seaweedfs/seaweedfs, observed and pull-tested 2026-10-02.
#   The digest is what is trusted; the tag is only for the reader. scripts/validate-deployment-
#   security.mjs requires a tag AND a digest and forbids `latest`, and
#   deploy/scripts/check-image-pins.sh (run weekly by CI) proves the digest still resolves.
#
# Runs as the image's own unprivileged `seaweed` user (uid 1000) with every capability dropped.
# Authentication is on: with no credentials configured the gateway would accept ANY key, so the
# two variables below are required, not defaulted.
#
# The master, volume and filer processes inside the container have no authentication of their own
# and are reachable by the other containers on the compose network (nothing is published to the
# host). That is acceptable for the convenience store this is; it is one more reason an enterprise
# deployment should point VERITY_S3_* at its own S3-compatible service instead.

services:
  objects:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Single-node server: master, volume server, filer and the S3 gateway in one process. The gateway
    # listens on 9000, so VERITY_S3_ENDPOINT=http://objects:9000 stays valid for existing env files.
    # 1 GiB volumes and an automatic volume count keep small disks usable.
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -s3
      - -s3.port=9000
    environment:
      # The S3 gateway's administrator identity. Without these it accepts any key pair.
      AWS_ACCESS_KEY_ID: ${VERITY_S3_ACCESS_KEY_ID:?set VERITY_S3_ACCESS_KEY_ID in the env file}
      AWS_SECRET_ACCESS_KEY: ${VERITY_S3_SECRET_ACCESS_KEY:?set VERITY_S3_SECRET_ACCESS_KEY in the env file}
      TZ: UTC
    volumes:
      - verity-bundled-storage-data:/data
    # NO PORTS. The application reaches it over the compose network.
    healthcheck:
      # The S3 root answers 403 by design, so health is the master's own check plus the S3 port being open.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/healthz && nc -z 127.0.0.1 9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    depends_on:
      objects:
        condition: service_healthy

volumes:
  verity-bundled-storage-data:
