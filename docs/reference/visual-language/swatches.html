<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verity Kind Hues</title>
<!--
  ADR-046 swatch sheet for product-owner sign-off. Values copied from src/app/globals.css
  (--color-hue-*, --color-state-*-fill|ink). If they differ, globals.css wins and this file is stale.
-->
<style>
  :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: #f2f2f7; color: #000; }
  main { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 1fr; } }
  section { padding: 24px 16px 40px; }
  section.dark { background: #000; color: #fff; }
  h1 { font-size: 34px; line-height: 41px; font-weight: 700; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .02em; font-weight: 600; margin: 24px 0 8px; opacity: .7; }
  p.lede { font-size: 15px; margin: 0 0 8px; opacity: .8; }
  .cell { background: #fff; border-radius: 12px; padding: 12px 16px; }
  .dark .cell { background: #1c1c1e; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .row + .row { border-top: 1px solid rgb(60 60 67 / .29); }
  .dark .row + .row { border-top-color: rgb(84 84 88 / .65); }
  .tile { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .disc { border-radius: 50%; }
  .name { font-size: 17px; font-weight: 600; min-width: 84px; }
  .hex { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .75; }
  .use { font-size: 13px; opacity: .75; margin-left: auto; text-align: right; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 13px; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 72px; }
  .bars span { width: 22px; border-radius: 4px 4px 0 0; }
  svg { display: block; }
</style>
</head>
<body>
<main>
  <section class="light" id="light"></section>
  <section class="dark" id="dark"></section>
</main>
<script>
  const HUES = {
    indigo:  { light: ["#e4e2f8", "#3e30cf"], dark: ["#3f3d50", "#aca6ed"], use: "Sales" },
    purple:  { light: ["#f1e3f6", "#9c37be"], dark: ["#47394e", "#d195e4"], use: "Buying, suppliers" },
    magenta: { light: ["#f5e1ed", "#b62b7c"], dark: ["#4d3745", "#e88cc2"], use: "People, parties" },
    teal:    { light: ["#deece7", "#117456"], dark: ["#264e43", "#47ebba"], use: "Stock" },
    cyan:    { light: ["#ddebed", "#0e7181"], dark: ["#254950", "#42d9f0"], use: "Money, tax, ledger" },
    olive:   { light: ["#e8ebdf", "#5d6e17"], dark: ["#444b2a", "#c4e151"], use: "Evidence, approvals, schedule" },
    brown:   { light: ["#efe8e2", "#8a5b33"], dark: ["#443d39", "#c2a78e"], use: "Locations, assets" },
    slate:   { light: ["#e8eaed", "#58687e"], dark: ["#3b3f45", "#9eadc2"], use: "Production, platform, audit" },
  };
  const STATES = {
    Draft:     { light: ["#ececec", "#69696d", "#6c6c70"], dark: ["#3c3c3f", "#aeaeb2", "#aeaeb2"] },
    Pending:   { light: ["#f4eade", "#995700", "#a86000"], dark: ["#4e3d25", "#ffb340", "#ffb340"] },
    Active:    { light: ["#dee6fb", "#0040dd", "#0040dd"], dark: ["#243850", "#4fa4ff", "#409cff"] },
    Blocked:   { light: ["#fadee1", "#cd0014", "#d70015"], dark: ["#4e2d2d", "#ff7870", "#ff6961"] },
    Completed: { light: ["#e2eee5", "#1e7634", "#1f7a36"], dark: ["#20462b", "#30db5b", "#30db5b"] },
    Cancelled: { light: ["#ececec", "#69696d", "#6c6c70"], dark: ["#3c3c3f", "#aeaeb2", "#aeaeb2"] },
  };
  const SERIES = ["indigo", "teal", "magenta", "olive", "cyan", "purple", "brown", "slate"];
  const BAR = [62, 48, 70, 35, 55, 42, 28, 50];
  const GLYPH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>';

  function lum(h) {
    const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
      .map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function cr(a, b) { const x = lum(a), y = lum(b); return ((Math.max(x, y) + .05) / (Math.min(x, y) + .05)).toFixed(2); }

  function render(theme) {
    const el = document.getElementById(theme);
    let html = `<h1>${theme === "light" ? "Light" : "Dark"}</h1>
      <p class="lede">Kind hues: icon tiles, discs, avatars and chart series only. Never pills or buttons.</p>
      <h2>Eight kind hues (provisional)</h2><div class="cell">`;
    for (const [n, v] of Object.entries(HUES)) {
      const [fill, ink] = v[theme];
      html += `<div class="row">
        <span class="tile" style="background:${fill};color:${ink}">${GLYPH}</span>
        <span class="tile disc" style="background:${fill};color:${ink}">${GLYPH}</span>
        <span class="name">${n}</span>
        <span class="hex">${fill} / ${ink}<br>${cr(ink, fill)}:1</span>
        <span class="use">${v.use}</span></div>`;
    }
    html += `</div><h2>State pills (from StateCategory)</h2><div class="cell"><div class="pills">`;
    for (const [n, v] of Object.entries(STATES)) {
      const [fill, ink, dot] = v[theme];
      html += `<span class="pill" style="background:${fill};color:${ink}" title="${cr(ink, fill)}:1"><span class="dot" style="background:${dot}"></span>${n}</span>`;
    }
    html += `</div></div><h2>Chart series order (illustration, not data)</h2><div class="cell"><div class="bars">`;
    SERIES.forEach((n, i) => { html += `<span style="height:${BAR[i]}px;background:${HUES[n][theme][1]}" title="${n}"></span>`; });
    html += `</div></div>`;
    el.innerHTML = html;
  }
  render("light");
  render("dark");
</script>
</body>
</html>
