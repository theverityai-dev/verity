name: wp09-enterprise-lab

# Task 108 WP-09 — isolated enterprise verification lab.
#
# Deliberately NOT run on every push (verify.yml is the fast per-commit
# gate). This is the heavier, closer-to-production proof: the real
# docker-compose deployment package, a real local IdP, a real backup/restore
# drill — the things `verify.yml`'s bare Postgres service cannot exercise.
#
# Manual trigger only. This is a first draft: `lab-core` reuses proven,
# already-tested scripts end to end and should be high-confidence; the
# `lab-oidc-lifecycle` job drives a real browser through a freshly-wired Dex
# instance that has never actually been run, and is the piece most likely to
# need a selector or config fix on its first real execution — see its own
# job comment and `e2e/oidc-login.spec.ts`'s doc comment.

on:
  workflow_dispatch:

jobs:
  lab-core:
    # Schema, DB security/RLS, capability states, business chains, files,
    # scheduled work, observability (WP-09 tracks 2,3,6,7,8,9,10) via the
    # EXISTING integration suite — now run against the real deployment
    # package instead of a bare `services:` Postgres. Plus WP-07's blind
    # backup/restore drill, using the actual `deploy/scripts/*.sh`.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate the lab env file
        run: ./deploy/scripts/install.sh # first call only writes the env file and exits 0

      - name: Point storage at the bundled object store (readiness requires a reachable object store and its bucket)
        run: |
          sed -i \
            -e 's|^VERITY_STORAGE_DRIVER=.*|VERITY_STORAGE_DRIVER=s3|' \
            -e 's|^VERITY_S3_BUCKET=.*|VERITY_S3_BUCKET=verity-lab|' \
            -e 's|^VERITY_S3_REGION=.*|VERITY_S3_REGION=us-east-1|' \
            -e 's|^VERITY_S3_ENDPOINT=.*|VERITY_S3_ENDPOINT=http://objects:9000|' \
            -e 's|^VERITY_S3_FORCE_PATH_STYLE=.*|VERITY_S3_FORCE_PATH_STYLE=true|' \
            deploy/config/verity.env

      # install.sh ensures the bucket itself (ensure-bucket.sh), before its own final health check.
      - name: Install the deployment (build, migrate, create the bucket, start db/objects/web/scheduler)
        run: VERITY_WITH_BUNDLED_STORAGE=1 ./deploy/scripts/install.sh

      - name: Health check (readiness, not just liveness)
        run: ./deploy/scripts/health.sh

      - name: Run the full integration suite against the compose database
        run: |
          PGPASS="$(sed -n 's/^POSTGRES_SUPERUSER_PASSWORD=//p' deploy/config/verity.env)"
          APPPASS="$(sed -n 's/^VERITY_APP_PASSWORD=//p' deploy/config/verity.env)"
          {
            echo "DIRECT_URL=postgresql://postgres:${PGPASS}@localhost:5432/verity"
            echo "DATABASE_URL=postgresql://verity_app:${APPPASS}@localhost:5432/verity"
            # This IS the isolated lab database `setup-env.ts` requires — the
            # guard's "remote" check is about accidentally hitting a shared
            # deployment, not about literally being on localhost, and a
            # docker-compose Postgres on a GitHub-hosted runner is neither.
            echo "VERITY_TEST_ALLOW_REMOTE_DATABASE=1"
          } >> .env.test
          npm test

      - name: Blind backup and restore drill (WP-07)
        run: |
          ./deploy/scripts/backup.sh
          DUMP="$(ls -t deploy/backups/*.dump | head -n1)"
          docker compose --project-name verity --env-file deploy/config/verity.env -f deploy/compose/docker-compose.yml stop web scheduler
          VERITY_RESTORE_CONFIRM=yes ./deploy/scripts/restore.sh "${DUMP}"
          docker compose --project-name verity --env-file deploy/config/verity.env -f deploy/compose/docker-compose.yml start web scheduler
          ./deploy/scripts/health.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp09-lab-core-evidence
          path: |
            deploy/backups/*.manifest
            /tmp/verity-health.json
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose --project-name verity --env-file deploy/config/verity.env -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.bundled-storage.yml down -v

  lab-oidc-lifecycle:
    # WP-09 §"Authentication/session" track + WP-05's exit criterion. See this
    # workflow's own header: the least-proven job here, never yet executed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Generate the lab env file
        run: ./deploy/scripts/install.sh

      - name: Point storage at the bundled object store
        run: |
          sed -i \
            -e 's|^VERITY_STORAGE_DRIVER=.*|VERITY_STORAGE_DRIVER=s3|' \
            -e 's|^VERITY_S3_BUCKET=.*|VERITY_S3_BUCKET=verity-lab|' \
            -e 's|^VERITY_S3_REGION=.*|VERITY_S3_REGION=us-east-1|' \
            -e 's|^VERITY_S3_ENDPOINT=.*|VERITY_S3_ENDPOINT=http://objects:9000|' \
            -e 's|^VERITY_S3_FORCE_PATH_STYLE=.*|VERITY_S3_FORCE_PATH_STYLE=true|' \
            deploy/config/verity.env

      - name: Generate Dex config (password hash + fixed test-user id)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils gettext-base
          DEX_LAB_PASSWORD="$(openssl rand -base64 24 | tr -d '\n=+/')"
          echo "DEX_LAB_PASSWORD=${DEX_LAB_PASSWORD}" >> "$GITHUB_ENV"
          export DEX_PASSWORD_HASH="$(htpasswd -bnBC 10 "" "${DEX_LAB_PASSWORD}" | tr -d ':\n')"
          export DEX_TEST_USER_ID="$(node -e "console.log(require('node:crypto').randomUUID())")"
          echo "DEX_TEST_USER_ID=${DEX_TEST_USER_ID}" >> "$GITHUB_ENV"
          envsubst < deploy/lab/dex-config.yaml.tmpl > deploy/lab/dex-config.yaml

      - name: Build and start db + objects + dex
        run: |
          docker compose --project-name verity --env-file deploy/config/verity.env \
            -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.bundled-storage.yml -f deploy/compose/docker-compose.lab-oidc.yml \
            build web scheduler
          docker compose --project-name verity --env-file deploy/config/verity.env \
            -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.bundled-storage.yml -f deploy/compose/docker-compose.lab-oidc.yml \
            up -d db objects dex

      - run: ./deploy/scripts/migrate.sh
      - name: Ensure the lab bucket (the same step install.sh runs)
        run: VERITY_WITH_BUNDLED_STORAGE=1 ./deploy/scripts/ensure-bucket.sh

      - name: Pre-provision the OIDC test identity (ADR-020 — never implicit)
        run: |
          PGPASS="$(sed -n 's/^POSTGRES_SUPERUSER_PASSWORD=//p' deploy/config/verity.env)"
          DIRECT_URL="postgresql://postgres:${PGPASS}@localhost:5432/verity" \
            npx tsx prisma/bootstrap-oidc-lab-identity.ts operator@verity-lab.test "WP-09 Lab Operator"

      - name: Start web + scheduler
        run: |
          docker compose --project-name verity --env-file deploy/config/verity.env \
            -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.bundled-storage.yml -f deploy/compose/docker-compose.lab-oidc.yml \
            up -d web scheduler
      - run: ./deploy/scripts/health.sh

      - name: OIDC browser lifecycle (login, session, logout)
        run: npx playwright test --config=playwright.oidc.config.ts
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp09-lab-oidc-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker compose --project-name verity --env-file deploy/config/verity.env \
            -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.bundled-storage.yml -f deploy/compose/docker-compose.lab-oidc.yml \
            down -v
          rm -f deploy/lab/dex-config.yaml
