name: verify

# The reproducibility gate, run on a machine nobody owns.
#
# Until now this repository had no CI at all, so every "all green" claim rested
# on one developer's laptop — which is also why a Windows-only build failure
# could not be confirmed or dismissed. This is the smallest workflow that makes
# the gate reproducible; it is deliberately not a deployment pipeline.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The suite refuses to run without a database: every DB test throws rather
      # than skips when CI is set (see `if (process.env.CI) throw` in the test
      # files). That is deliberate — a skipped isolation test proves nothing, and
      # CI must never be the place where tenancy silently stops being verified.
      postgres:
        # Match the first supported on-prem profile. A newer PostgreSQL major
        # belongs in a separate compatibility lane, not as the only CI proof.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verity
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Two roles, exactly as production separates them.
      #   DIRECT_URL  — privileged, migrations only
      #   DATABASE_URL — the runtime role, NOSUPERUSER NOBYPASSRLS
      VERITY_SESSION_SECRET: isolated-ci-signing-secret-not-for-production
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/verity
      DATABASE_URL: postgresql://verity_app:verity_app@localhost:5432/verity
      # `config.ts`'s `loadConfig()` runs at module import time and throws
      # `E_CONFIG_INVALID` if these are absent when `provider: "supabase"`
      # (the default) — it never crashed CI before because the RLS-bypass
      # step above always failed first. Plain placeholder strings, not real
      # secrets: `configSchema` only checks presence (`z.string()`), never
      # `.url()` format or a live Supabase project, so a fake value here is
      # sufficient to let module loading and the test suite proceed.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate workflow mappings
        run: npm run validate:workflow

      - name: Validate deployment security invariants
        run: npm run validate:deployment-security

      - name: Assert security-sensitive dependency versions
        run: npm ls next@16.3.3 eslint-config-next@16.3.3 vitest@4.1.11 @vitest/mocker@4.1.11

      - name: Generate the Prisma client
        run: npm run prisma:generate

      # The runtime role must NOT be able to bypass RLS. Creating it as a
      # superuser here would make `assertRlsEnforceable` pass vacuously and every
      # isolation assertion below it meaningless — the exact failure mode the
      # guard exists to catch.
      - name: Create the non-bypassing runtime role
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE verity_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'verity_app';
          GRANT USAGE ON SCHEMA public TO verity_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO verity_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO verity_app;
          SQL

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Migrations create the `verity` schema and its functions, so these grants
      # cannot be issued before `migrate deploy`.
      - name: Grant the runtime role what the migrations created
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA verity TO verity_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO verity_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO verity_app;
          REVOKE ALL ON TABLE public._prisma_migrations, public.request_quota FROM verity_app;
          SQL

      - name: Prove SECURITY DEFINER functions are not public executable
        run: |
          count="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*)
               FROM pg_proc p
               JOIN pg_namespace n ON n.oid = p.pronamespace
               CROSS JOIN LATERAL aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a
              WHERE n.nspname = 'verity'
                AND p.prosecdef
                AND a.grantee = 0
                AND a.privilege_type = 'EXECUTE'")"
          test "$count" = "0"

      - name: Prove the runtime role cannot bypass RLS
        run: |
          # `boolean || text` casts through boolean-to-text, which Postgres
          # spells "true"/"false" — NOT the "t"/"f" psql prints for a raw
          # boolean column. This step never matched since it was written
          # (058711e): `rolsuper`/`rolbypassrls` concatenated with `||` here
          # always print as "false", so the old `super=f bypassrls=f`
          # pattern could never match and this "pass" was never actually
          # proven, on any branch.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolname||' super='||rolsuper||' bypassrls='||rolbypassrls
               FROM pg_roles WHERE rolname = current_user" | tee /tmp/role.txt
          grep -q 'super=false bypassrls=false' /tmp/role.txt

      - run: npm run typecheck
      - run: npm run lint
      # Dependencies nothing imports. Add a package to knip.json only with a reason.
      - run: npm run check:deps
      - run: npm test
      - run: npm run build
